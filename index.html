<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1c1a1a" />
<title>测测你上辈子是什么身份</title>
<style>
  :root {
    --ink: #2b2118;
    --ink-soft: #5a4a3a;
    --gold: #c9a05f;
    --gold-deep: #a8823f;
    --paper: #f3ecdd;
    --paper-2: #e9dfc9;
    --seal: #b0342c;
    --line: rgba(120, 90, 50, .22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: "STKaiti", "KaiTi", "Kaiti SC", "FangSong", "Noto Serif SC", "Songti SC", "SimSun", serif;
    color: var(--ink);
    background: var(--paper);
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 15% -10%, #f7f1e3 0%, rgba(247,241,227,0) 55%),
      radial-gradient(900px 600px at 110% 10%, #ede2cd 0%, rgba(237,226,205,0) 50%),
      linear-gradient(180deg, #f5efe2 0%, #ece1cb 55%, #e6d9c0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* 宣纸纹理 */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(rgba(120,90,50,.035) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: multiply;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ============ 顶部装饰 ============ */
  .seal-float {
    position: absolute;
    top: -18px; right: 6px;
    width: 54px; height: 54px;
    background: var(--seal);
    color: #f8efdd;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 17px; line-height: 1.05;
    letter-spacing: 2px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(176,52,44,.35);
    transform: rotate(6deg);
    z-index: 3;
  }
  .seal-float span { display: block; }

  /* ============ 卡片 ============ */
  .card {
    position: relative;
    background: rgba(250, 245, 233, .92);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(74, 54, 30, .16), 0 2px 8px rgba(74,54,30,.06);
    padding: 30px 24px 26px;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 10px;
    border: 1px solid rgba(169, 130, 63, .35);
    border-radius: 12px;
    pointer-events: none;
  }

  /* ============ 标题页 ============ */
  .hero { text-align: center; padding-top: 6px; }
  .hero .kicker {
    font-size: 12px; letter-spacing: 6px;
    color: var(--gold-deep); margin-bottom: 14px;
  }
  .hero h1 {
    font-size: 30px; line-height: 1.35; font-weight: 700;
    letter-spacing: 2px; color: var(--ink);
  }
  .hero h1 .hl { color: var(--seal); }
  .hero .sub {
    margin-top: 14px; font-size: 14px; color: var(--ink-soft);
    line-height: 1.9; letter-spacing: 1px;
  }
  .divider {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin: 22px 0;
    color: var(--gold-deep);
  }
  .divider::before, .divider::after {
    content: ""; height: 1px; width: 60px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .divider::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .divider .diamond {
    width: 8px; height: 8px; background: var(--gold);
    transform: rotate(45deg); flex: none;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; border: none;
    font-family: inherit;
    background: linear-gradient(135deg, #b89150 0%, #9a7438 100%);
    color: #fbf3e2;
    font-size: 17px; letter-spacing: 4px;
    padding: 15px 0; width: 100%;
    border-radius: 40px;
    box-shadow: 0 10px 24px rgba(154,116,56,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: translateY(1px) scale(.985); box-shadow: 0 5px 14px rgba(154,116,56,.3); }
  .btn.ghost {
    background: transparent; color: var(--gold-deep);
    border: 1px solid var(--gold); box-shadow: none;
    letter-spacing: 2px;
  }

  .hero .tips {
    margin-top: 18px; font-size: 12px; color: #9a8a74; letter-spacing: 1px;
  }

  /* ============ 题目页 ============ */
  .quiz-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .quiz-head .num { font-size: 13px; color: var(--gold-deep); letter-spacing: 1px; }
  .quiz-head .back {
    font-size: 13px; color: var(--ink-soft); cursor: pointer;
    letter-spacing: 1px; padding: 4px 6px;
  }
  .progress {
    height: 5px; border-radius: 3px;
    background: rgba(169,130,63,.16);
    overflow: hidden; margin-bottom: 24px;
  }
  .progress i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--gold), #c89a52);
    border-radius: 3px; transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  .q-title {
    font-size: 21px; line-height: 1.55; font-weight: 700;
    letter-spacing: 1px; margin-bottom: 22px; color: var(--ink);
  }
  .q-title .q-no { color: var(--seal); margin-right: 6px; }

  .opts { display: flex; flex-direction: column; gap: 13px; }
  .opt {
    position: relative;
    display: flex; align-items: center; gap: 13px;
    background: #fffdf6;
    border: 1px solid rgba(169,130,63,.22);
    border-radius: 14px;
    padding: 15px 16px;
    cursor: pointer;
    transition: all .22s ease;
    box-shadow: 0 2px 6px rgba(74,54,30,.05);
  }
  .opt .tag {
    flex: none; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--gold);
    border-radius: 50%;
    color: var(--gold-deep); font-size: 14px;
    transition: all .22s ease;
  }
  .opt .txt { font-size: 15.5px; line-height: 1.5; letter-spacing: .5px; color: #3a3127; }
  .opt:active { transform: scale(.985); }
  .opt.pick {
    background: linear-gradient(135deg, #fdf1dc 0%, #f7e6c6 100%);
    border-color: var(--gold);
    box-shadow: 0 6px 16px rgba(169,130,63,.22);
  }
  .opt.pick .tag { background: var(--gold); color: #fff; border-color: var(--gold); }

  /* ============ 结果页 ============ */
  .result { text-align: center; }
  .result .r-kicker {
    font-size: 12px; letter-spacing: 5px; color: var(--gold-deep); margin-bottom: 10px;
  }
  .result .r-name {
    font-size: 34px; font-weight: 700; letter-spacing: 3px; margin-bottom: 6px;
  }
  .result .r-past {
    font-size: 16px; letter-spacing: 2px; color: var(--ink-soft); margin-bottom: 20px;
  }
  .result .r-past b { color: var(--seal); font-weight: 700; }

  /* 结果卡片（也是海报主体） */
  .poster {
    position: relative;
    border-radius: 18px;
    padding: 34px 24px 30px;
    color: #fdf6e8;
    text-align: center;
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(40,30,18,.32);
    margin-bottom: 22px;
    isolation: isolate;
  }
  .poster::before {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(255, 240, 210, .4);
    border-radius: 12px; pointer-events: none; z-index: 1;
  }
  .poster .p-moon {
    position: absolute; top: -40px; right: -30px; width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(255,255,255,.5), rgba(255,255,255,.08) 60%, transparent 70%);
    z-index: 0;
  }
  .poster .p-cloud {
    position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
    background: linear-gradient(180deg, transparent, rgba(20,14,8,.28));
    z-index: 0;
  }
  .poster > * { position: relative; z-index: 2; }

  .poster .p-top {
    font-size: 11px; letter-spacing: 6px; opacity: .85; margin-bottom: 26px;
  }
  .poster .p-title {
    font-size: 42px; font-weight: 700; letter-spacing: 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,.25);
    margin-bottom: 8px;
  }
  .poster .p-past {
    font-size: 16px; letter-spacing: 3px; opacity: .95; margin-bottom: 22px;
  }
  .poster .p-line {
    width: 46px; height: 2px; margin: 0 auto 20px;
    background: rgba(255,240,210,.6);
  }
  .poster .p-text {
    font-size: 15.5px; line-height: 2.05; letter-spacing: 1px;
    opacity: .96; text-align: justify; text-align-last: center;
    background: rgba(0,0,0,.14);
    border-radius: 12px; padding: 18px 16px;
  }
  .poster .p-seal {
    position: absolute; right: 26px; bottom: 24px; z-index: 3;
    width: 46px; height: 46px;
    background: var(--seal);
    color: #fdf1dd;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1.05; letter-spacing: 2px;
    border-radius: 7px; transform: rotate(6deg);
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
  }
  .poster .p-foot {
    margin-top: 20px; font-size: 11px; letter-spacing: 3px; opacity: .75;
  }

  .result-actions { display: flex; flex-direction: column; gap: 12px; }
  .result-actions .row { display: flex; gap: 12px; }
  .result-actions .row .btn { flex: 1; }

  /* ============ 选择回顾 ============ */
  .review { text-align: left; margin-bottom: 22px; }
  .review .rv-kicker {
    text-align: center; font-size: 12px; letter-spacing: 5px;
    color: var(--gold-deep); margin-bottom: 6px;
  }
  .review .rv-title {
    text-align: center; font-size: 17px; font-weight: 700;
    letter-spacing: 2px; color: var(--ink); margin-bottom: 4px;
  }
  .review .rv-tip {
    text-align: center; font-size: 12px; color: #9a8a74;
    letter-spacing: 1px; margin-bottom: 14px;
  }
  .review-item {
    background: #fffdf6;
    border: 1px solid rgba(169,130,63,.22);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(74,54,30,.05);
  }
  .review-item .ri-q {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; cursor: pointer;
    transition: background .2s ease;
  }
  .review-item .ri-q:active { background: #f7efdd; }
  .review-item .ri-no {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold); color: #fff; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .review-item .ri-title {
    flex: 1; font-size: 14px; line-height: 1.4; color: var(--ink); letter-spacing: .5px;
  }
  .review-item .ri-arrow {
    flex: none; color: var(--gold-deep); font-size: 14px;
    transition: transform .2s ease;
  }
  .review-item.open .ri-arrow { transform: rotate(90deg); }
  .review-item .ri-body { display: none; padding: 2px 14px 14px 48px; }
  .review-item.open .ri-body { display: block; }
  .review-item .ri-opt {
    font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; letter-spacing: .5px;
  }
  .review-item .ri-opt b { color: var(--seal); font-weight: 700; }
  .review-item .ri-say {
    font-size: 13.5px; line-height: 1.75; color: #5a4a3a; letter-spacing: .5px;
    background: #f7efdd; border-radius: 8px; padding: 10px 12px;
    border-left: 3px solid var(--gold);
  }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(43,33,24,.92); color: #f7efdd;
    padding: 11px 22px; border-radius: 30px; font-size: 14px; letter-spacing: 1px;
    opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 99;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }

  .fade-in { animation: fadeUp .5s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="seal-float"><span>前</span><span>世</span></div>

    <!-- 标题页 -->
    <div class="card" id="screen-start">
      <div class="hero">
        <div class="kicker">— 前世今生 · 命理小测 —</div>
        <h1>测测你上辈子<br>是什么<span class="hl">身份</span></h1>
        <div class="divider"><span class="diamond"></span></div>
        <p class="sub">八道题，循着你的脾气与选择<br>照见那一世的自己</p>
        <button class="btn" id="btn-start">开始测试</button>
        <div class="tips">仅供参考 · 图个乐呵</div>
      </div>
    </div>

    <!-- 题目页 -->
    <div class="card hidden" id="screen-quiz">
      <div class="quiz-head">
        <span class="back" id="btn-back">‹ 上一题</span>
        <span class="num" id="q-num">1 / 8</span>
      </div>
      <div class="progress"><i id="progress-bar"></i></div>
      <div class="q-title" id="q-title"></div>
      <div class="opts" id="q-opts"></div>
    </div>

    <!-- 结果页 -->
    <div class="card hidden" id="screen-result">
      <div class="result">
        <div class="r-kicker" id="r-kicker">你的前世身份</div>
        <div class="r-name" id="r-name"></div>
        <div class="r-past">前世名 · <b id="r-past"></b></div>
        <div class="poster" id="poster"></div>
        <div class="review">
          <div class="rv-kicker">— 你的选择回顾 —</div>
          <div class="rv-title">这一路，你是这样选的</div>
          <div class="rv-tip">点开每一条，看看你的选择与解读</div>
          <div class="review-list" id="review-list"></div>
        </div>
        <div class="result-actions">
          <button class="btn" id="btn-save">保存 / 分享海报</button>
          <div class="row">
            <button class="btn ghost" id="btn-retest">再测一次</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ============ 数据 ============ */
var IDS = ["女侠","女将军","贵妃","东家","绣女","说书人"];

var QUESTIONS = [
  {
    q: "社交场上的你，更像哪种人？",
    opts: [
      { t: "话不多，但一眼看穿局面", w: { "贵妃": 3, "东家": 1, "女将军": 1 }, say: "你心里明镜似的，只是懒得点破——这份通透，是前世在深宫里练出来的。" },
      { t: "一开口，就有人想听下去", w: { "说书人": 3, "贵妃": 1, "女侠": 1 }, say: "你一开口就有人侧耳，这本事从说书台上一脉相承。" },
      { t: "默默张罗，把每个人照顾好", w: { "东家": 3, "女侠": 1, "绣女": 1 }, say: "把每个人都放在心上，是你前世操持一方时留下的温柔。" },
      { t: "想走就走，不硬撑到散场", w: { "女侠": 3, "女将军": 1, "说书人": 1 }, say: "不勉强、不硬撑，前世你也是这么说走就走的性子。" }
    ]
  },
  {
    q: "你更向往哪一种“厉害”？",
    opts: [
      { t: "靠实力，让人心服口服", w: { "女将军": 3, "贵妃": 1, "东家": 1 }, say: "你信真本事，不信巧言——这世间，唯有实力才立得住。" },
      { t: "把一件事，做到无人能及", w: { "绣女": 3, "说书人": 1, "女将军": 1 }, say: "你愿为一件事穷尽一生，这是绣娘眼里“技近乎道”的执着。" },
      { t: "白手起家，越做越大", w: { "东家": 3, "女将军": 1, "贵妃": 1 }, say: "从无到有最见本事，你骨子里有东家的盘算与魄力。" },
      { t: "越难越上，从不认输", w: { "女将军": 3, "女侠": 1, "东家": 1 }, say: "越难越兴奋，这份不服输，是沙场磨出来的血性。" }
    ]
  },
  {
    q: "心情低落时，你更想怎么排解？",
    opts: [
      { t: "一个人出去透透气", w: { "女侠": 3, "绣女": 1, "女将军": 1 }, say: "独行是你的解药，前世你也是这样一骑绝尘散心去。" },
      { t: "找个人痛快聊一场", w: { "说书人": 3, "女侠": 1, "贵妃": 1 }, say: "说破无毒，你一聊就通，天生的表达让情绪有了出口。" },
      { t: "沉下心做点具体的事", w: { "绣女": 3, "东家": 1, "女将军": 1 }, say: "手上忙着，心就静了——这是绣娘安抚自己的方式。" },
      { t: "先稳住自己，理清头绪", w: { "贵妃": 3, "东家": 1, "女将军": 1 }, say: "越乱越要清醒，这份自持，是前世在风浪里练出的定力。" }
    ]
  },
  {
    q: "你最舍不得丢掉的是？",
    opts: [
      { t: "一身骨气，不向谁低头", w: { "女将军": 3, "女侠": 1, "贵妃": 1 }, say: "骨气是你的命，前世你为它上过战场，这辈子也不肯折。" },
      { t: "一份温柔，给世界留有余地", w: { "绣女": 3, "说书人": 1, "女侠": 1 }, say: "你舍不得对人冷，这份温柔是你前世留给世间的暖。" },
      { t: "一份清醒，不被情绪带偏", w: { "贵妃": 3, "女将军": 1, "东家": 1 }, say: "清醒最难得，你在六宫风浪里守住的，正是这份不迷。" },
      { t: "一份精明，不吃糊涂亏", w: { "东家": 3, "贵妃": 1, "女将军": 1 }, say: "你心里有本账，吃亏可以，糊里糊涂不行。" }
    ]
  },
  {
    q: "朋友遇到麻烦，你通常会？",
    opts: [
      { t: "直接上手，帮他把事摆平", w: { "女将军": 3, "女侠": 1, "东家": 1 }, say: "你最见不得乱，出手便是替人做主，是天生扛事的性子。" },
      { t: "陪他聊聊，先把情绪理顺", w: { "说书人": 3, "贵妃": 1, "绣女": 1 }, say: "先顺气再办事，你懂人心，一句话能安定半场人。" },
      { t: "帮他盘算利弊，想条出路", w: { "东家": 3, "贵妃": 1, "女将军": 1 }, say: "你习惯先算清楚再动手，这是生意人刻进骨子里的稳妥。" },
      { t: "第一个到场，替他兜底", w: { "女将军": 3, "女侠": 1, "东家": 1 }, say: "危难时你第一个到，这份义气，是将军对袍泽的担当。" }
    ]
  },
  {
    q: "你更愿意把时间花在？",
    opts: [
      { t: "磨一门越磨越精的手艺", w: { "绣女": 3, "女将军": 1, "说书人": 1 }, say: "你把时间投给一门手艺，沉得住气，是绣娘的心性。" },
      { t: "看更大的世界，多走多看", w: { "女侠": 3, "说书人": 1, "东家": 1 }, say: "天地广阔才是你的归处，前世你已看遍山河。" },
      { t: "学一身走到哪都不慌的本事", w: { "女侠": 3, "绣女": 1, "东家": 1 }, say: "本事傍身最安心，走到哪儿都能安身立命。" },
      { t: "攒一份实打实的底气", w: { "东家": 3, "女将军": 1, "绣女": 1 }, say: "底气比什么都实在，你一步步攒出来的，最靠得住。" }
    ]
  },
  {
    q: "你最不想听到别人说你？",
    opts: [
      { t: "“你就是运气好”", w: { "女将军": 3, "绣女": 1, "东家": 1 }, say: "你最烦被说成凭运气，因为你知道自己每一步都是实力。" },
      { t: "“你就是想太多”", w: { "贵妃": 3, "说书人": 1, "东家": 1 }, say: "想得多不是坏事，你看得透，才想得深。" },

var CAT = {
  name:"前世的一只猫", past:"无名之猫", c1:"#54402a", c2:"#c98a3d",

/* ============ 状态 ============ */
var cur = 0;
var answers = [];

var $ = function(id){ return document.getElementById(id); };
var screens = {
  start:  $("screen-start"),
  quiz:   $("screen-quiz"),
  result: $("screen-result")
};
var TOAST_TIMER = null;

function show(name){
  for (var k in screens) screens[k].classList.add("hidden");
  screens[name].classList.remove("hidden");
  screens[name].classList.remove("fade-in");
  void screens[name].offsetWidth;
  screens[name].classList.add("fade-in");
}
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* ============ 题目渲染 ============ */
var LBL = ["A","B","C","D"];

function renderQuestion(){
  var q = QUESTIONS[cur];
  $("q-num").textContent = (cur+1) + " / " + QUESTIONS.length;
  $("progress-bar").style.width = ((cur+1)/QUESTIONS.length*100) + "%";
  $("q-title").innerHTML = '<span class="q-no">' + (cur+1) + '.</span>' + q.q;
  var box = $("q-opts");
  box.innerHTML = "";
  q.opts.forEach(function(o, i){
    var div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = '<span class="tag">' + LBL[i] + '</span><span class="txt">' + o.t + '</span>';
    div.addEventListener("click", function(){ pick(div, o); });
    box.appendChild(div);
  });
}

function pick(el, o){
  if (el.classList.contains("pick")) return;
  el.classList.add("pick");
  answers[cur] = { q: QUESTIONS[cur].q, opt: o };
  setTimeout(function(){
    if (cur < QUESTIONS.length - 1){
      cur++;
      renderQuestion();
    } else {
      finish();
    }
  }, 260);
}

/* ============ 结果计算 ============ */
function computeResultInner(){
  // 1/20 彩蛋
  if (Math.random() < 0.05) return CAT;
  var tally = {};
  answers.forEach(function(a){
    if (!a) return;
    var w = a.opt.w || {};
    for (var k in w) tally[k] = (tally[k] || 0) + w[k];
  });
  var best = null, bestScore = -1, ties = [];
  IDS.forEach(function(id){
    var s = tally[id] || 0;
    if (s > bestScore){ bestScore = s; best = id; ties = [id]; }
    else if (s === bestScore){ ties.push(id); }
  });
  // 同分随机取一
  return RESULTS[ties[Math.floor(Math.random() * ties.length)]];
}

function finish(){
  var r = computeResultInner();
  currentResult = r;
  $("r-name").textContent = r.name;
  $("r-past").textContent = r.past;
  $("r-kicker").textContent = (r === CAT) ? "恭喜触发彩蛋" : "你的前世身份";
  renderPosterHTML(r);
  renderReview();
  show("result");
}

function renderReview(){
  var box = $("review-list");

    item.className = "review-item";

    item.querySelector(".ri-q").addEventListener("click", function(){
      item.classList.toggle("open");

/* ============ 海报生成（Canvas，无外部依赖） ============ */
var FONT = '"STKaiti","KaiTi","Kaiti SC","FangSong","Noto Serif SC","Songti SC","SimSun",serif';

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  var chars = Array.from(text);
  var lines = [], line = "";
  for (var i=0; i<chars.length; i++){
    var test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = chars[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function buildPoster(r){
  var W = 1080, H = 1440;
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var ctx = c.getContext("2d");

  // 背景
  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, r.c1);
  bg.addColorStop(1, r.c2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 光晕 / 月
  var moon = ctx.createRadialGradient(W*0.82, 90, 20, W*0.82, 90, 260);
  moon.addColorStop(0, "rgba(255,255,255,.30)");
  moon.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = moon;
  ctx.fillRect(0, 0, W, H);

  // 底部山影
  ctx.fillStyle = "rgba(15,10,6,.30)";
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, H-180);
  ctx.quadraticCurveTo(W*0.18, H-330, W*0.34, H-200);
  ctx.quadraticCurveTo(W*0.5, H-80, W*0.62, H-230);
  ctx.quadraticCurveTo(W*0.82, H-380, W, H-150);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // 金色内框
  ctx.strokeStyle = "rgba(255,238,205,.45)";
  ctx.lineWidth = 3;
  ctx.strokeRect(34, 34, W-68, H-68);
  ctx.strokeStyle = "rgba(255,238,205,.18)";
  ctx.lineWidth = 1;
  ctx.strokeRect(48, 48, W-96, H-96);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // 顶部小字
  ctx.fillStyle = "rgba(255,246,232,.82)";
  ctx.font = "28px " + FONT;
  ctx.fillText("· 测测你上辈子是什么身份 ·", W/2, 150);

  // 身份名
  ctx.fillStyle = "#fff7ea";
  ctx.font = "700 104px " + FONT;
  ctx.shadowColor = "rgba(0,0,0,.28)";
  ctx.shadowBlur = 18;
  ctx.fillText(r.name, W/2, 400);
  ctx.shadowBlur = 0;

  // 前世名
  ctx.fillStyle = "rgba(255,246,232,.95)";
  ctx.font = "44px " + FONT;
  ctx.fillText("前世名 · " + r.past, W/2, 500);

  // 分隔线
  ctx.strokeStyle = "rgba(255,240,210,.65)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2-60, 570); ctx.lineTo(W/2+60, 570);
  ctx.stroke();

  // 判词（卡片框）
  var boxW = W-220, boxX = 110, boxY = 640;
  ctx.fillStyle = "rgba(0,0,0,.16)";
  roundRect(ctx, boxX, boxY, boxW, 380, 24);
  ctx.fill();

  ctx.fillStyle = "rgba(255,248,235,.97)";
  ctx.font = "40px " + FONT;
  var lines = wrapText(ctx, r.text, boxW-110);
  var lh = 66, startY = boxY + 190 - (lines.length-1)*lh/2;
  lines.forEach(function(ln, i){
    ctx.fillText(ln, W/2, startY + i*lh);
  });

  // 印章
  drawSeal(ctx, W-170, H-170, 110, "前世");

  // 底部
  ctx.fillStyle = "rgba(255,246,232,.72)";
  ctx.font = "26px " + FONT;
  ctx.fillText("前世今生 · 命中注定", W/2, H-70);

  return c;
}

function drawSeal(ctx, x, y, size, text){
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.35)";
  ctx.shadowBlur = 10;
  ctx.fillStyle = "#b0342c";
  roundRect(ctx, x, y, size, size, size*0.12);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fdf1dd";
  var chars = Array.from(text);
  ctx.font = "700 " + Math.floor(size*0.36) + "px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  var gap = size / (chars.length + 1);
  chars.forEach(function(ch, i){
    ctx.fillText(ch, x + size/2, y + gap*(i+1));
  });
  ctx.restore();
}

/* ============ 保存 / 分享 ============ */
function saveOrShare(){
  var r = computeResultDisplay();
  var c = buildPoster(r);
  var btn = $("btn-save");
  btn.textContent = "正在生成…";
  btn.style.opacity = .7;

  c.toBlob(function(blob){
    btn.textContent = "保存 / 分享海报";
    btn.style.opacity = 1;
    if (!blob){ toast("生成失败，请截图保存"); return; }

    var file = new File([blob], "前世身份_"+ r.past +".png", { type: "image/png" });
    var nav = navigator;
    if (nav.canShare && nav.canShare({ files: [file] })){
      nav.share({ files: [file], title: "测测你上辈子是什么身份" })
        .catch(function(){ downloadBlob(blob, file.name); });
    } else {
      downloadBlob(blob, file.name);
    }
  }, "image/png");
}

// 结果页当前显示的结果（与 finish 时一致）
var currentResult = null;
function computeResultDisplay(){
  // finish 时已存 currentResult，避免二次随机导致彩蛋/同分不一致
  return currentResult || CAT;
}

function downloadBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 300);
  toast("海报已保存到相册/下载");
}

/* ============ 事件绑定 ============ */
$("btn-start").addEventListener("click", function(){
  cur = 0; answers = [];
  renderQuestion();
  show("quiz");
});

$("btn-back").addEventListener("click", function(){
  if (cur === 0){
    show("start");
  } else {
    cur--;
    renderQuestion();
  }
});

$("btn-retest").addEventListener("click", function(){
  cur = 0; answers = []; currentResult = null;
  renderQuestion();
  show("quiz");
});

$("btn-save").addEventListener("click", saveOrShare);
